function topics(){const tags=[...new Set(active().map(t=>t.tag))],all=active(),ids=new Map(all.map(t=>[t.id,t]));const matches=t=>(filter==='all'||filter===autoStatus(t)||filter==='pinned'&&t.pinned||filter.startsWith('tag:')&&t.tag===filter.slice(4))&&(t.title+' '+t.content).toLowerCase().includes(query.toLowerCase());const arr=all.filter(matches).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated_at.localeCompare(a.updated_at));const edges=links.filter(l=>!l.deleted&&ids.has(l.a)&&ids.has(l.b));const children=id=>[...new Set(edges.filter(l=>l.type==='supplement'&&l.a===id).map(l=>l.b))].map(id=>ids.get(id));const parents=id=>edges.filter(l=>l.type==='supplement'&&l.b===id).map(l=>ids.get(l.a));const relatedCount=id=>edges.filter(l=>l.type==='related'&&(l.a===id||l.b===id)).length;const searchOn=!!query.trim();const visited=new Set();const groupCard=(root,level=0)=>{if(visited.has(root.id)||level>10)return '';visited.add(root.id);const kids=children(root.id),show=matches(root)||kids.some(c=>matches(c)),collapsed=collapsedTopicGroups.has(root.id)&&!searchOn;let html='';if(show){html=`<div class="nv-topic-group"><div class="nv-group-head"><button type="button" class="nv-group-toggle" data-group-toggle="${root.id}" aria-expanded="${!collapsed}" title="Thu gọn hoặc mở rộng">${collapsed?'▸':'▾'}</button><div class="nv-group-main" data-open="${root.id}"><strong>${esc(root.title)}</strong><small>${kids.length} bổ sung · ${relatedCount(root.id)} liên quan · ${(count(root.content)+kids.reduce((n,k)=>n+count(k.content),0)).toLocaleString('vi-VN')} chữ</small></div></div>${!collapsed?`<div class="nv-group-children">${kids.filter(c=>matches(c)||searchOn&&children(c.id).some(matches)).map(c=>`<div class="nv-group-child" data-open="${c.id}"><span>↳</span><div><strong>${esc(c.title)}</strong><small>${count(c.content).toLocaleString('vi-VN')} chữ · ${autoStatus(c)==='done'?'Hoàn thành':autoStatus(c)==='draft'?'Đang viết':'Chưa viết'}</small></div></div>`).join('')}</div>`:''}</div>`}kids.forEach(k=>visited.add(k.id));return html};let body='';if(topicView==='all')body=arr.map(topicCard).join('');else if(topicView==='supplement')body=arr.filter(t=>parents(t.id).length).map(t=>`<div class="nv-supplement-list-item" data-open="${t.id}"><strong>↳ ${esc(t.title)}</strong><small>Bổ sung cho: ${esc([...new Set(parents(t.id).map(p=>p.title))].join(', '))}</small></div>`).join('');else{const roots=all.filter(t=>!parents(t.id).length).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated_at.localeCompare(a.updated_at));body=roots.map(t=>groupCard(t)).join('');body+=all.filter(t=>!visited.has(t.id)&&matches(t)).map(t=>groupCard(t)).join('')}return `<div class="card nv-topic-filters"><div class="row"><input id="search" class="grow" placeholder="Tìm kiếm bài viết..." value="${esc(query)}"><select id="filter"><option value="all">Tất cả</option><option value="todo">Chưa viết</option><option value="draft">Đang viết</option><option value="done">Đã viết</option><option value="pinned">Đã ghim</option>${tags.map(t=>`<option value="tag:${esc(t)}"># ${esc(t)}</option>`).join('')}</select></div><div class="nv-topic-view" role="group" aria-label="Chế độ xem">${[['all','Tất cả'],['group','Theo nhóm'],['supplement','Bài bổ sung']].map(([v,l])=>`<button type="button" data-topic-view="${v}" class="${topicView===v?'active':''}" aria-pressed="${topicView===v}">${l}</button>`).join('')}</div><div class="nv-topic-filter-foot"><p class="hint">${arr.length} chủ đề phù hợp</p><div class="row">${topicView==='group'?'<button type="button" id="collapseTopicGroups" class="nv-density-btn">Thu gọn tất cả</button>':''}<button type="button" id="topicDensityToggle" class="nv-density-btn" title="Đổi mật độ thẻ">${topicDensity==='compact'?'▤ Gọn':'▦ Thoáng'}</button></div></div></div>${body||'<div class="card hint">Không có chủ đề phù hợp.</div>'}`}
const reviewCycle={unclassified:30,urgent_important:1,urgent:3,important:7,not_important:15};const cycleDays=t=>reviewCycle[t.priority]||30;const lastTouch=t=>Math.max(new Date(t.last_reviewed||0).getTime()||0,new Date(t.last_written||0).getTime()||0,new Date(t.created_at||0).getTime()||0);const dueAt=t=>lastTouch(t)+cycleDays(t)*86400000;const isDue=t=>Date.now()>=dueAt(t);function eligible(){return active().filter(t=>t.rating!=='none'&&isDue(t))}
function review(){const arr=eligible().sort((a,b)=>dueAt(a)-dueAt(b));return `<div class="card"><div class="title">🔁 Ôn lại kiến thức</div><p class="hint">Chu kỳ theo ưu tiên: Quan trọng & gấp 1 ngày · Gấp 3 ngày · Quan trọng 7 ngày · Không quan trọng 15 ngày · Mặc định 30 ngày. Xác nhận bằng nút Đã ôn.</p><button class="btn" id="randomReview">🎲 Chọn bài ngẫu nhiên</button></div><div class="title">Đến hạn ôn · ${arr.length} bài</div>${arr.map(topicCard).join('')||'<div class="card hint">Chưa có bài đến hạn ôn.</div>'}`}

<div class="settings-footer"><button class="btn" id="saveSettings">Lưu cài đặt</button></div></div>`}
function account(){return `<div class="account-page"><div class="settings-title"><button class="settings-back" id="accountBack" aria-label="Quay lại">←</button><div><h2>Tài khoản</h2><p class="hint">Đăng nhập và đồng bộ an toàn</p></div></div><div class="account-hero"><div class="account-avatar">✍</div><h2>NHANHVALE WRITE</h2><p>Lưu trên thiết bị, đồng bộ qua Supabase khi đăng nhập.</p></div><section class="settings-group"><h3>Đăng nhập tài khoản</h3><button class="btn" id="googleLogin" type="button" style="width:100%;margin:12px 0;background:#fff;color:#202124;border:1px solid #dadce0;font-weight:700">🌐 Tiếp tục với Google</button><p class="hint" style="text-align:center">Hoặc đăng nhập bằng liên kết email</p><p class="hint" id="accountStatus">Đang kiểm tra phiên đăng nhập…</p><label for="email">Địa chỉ email</label><input id="email" type="email" autocomplete="email" placeholder="ten@example.com" value="${esc(db.settings.email||'')}"><div class="settings-actions"><button class="btn" id="login">Gửi liên kết đăng nhập</button><button class="btn secondary" id="logout" hidden>Đăng xuất</button></div><p class="hint">Mở email xác nhận trên cùng trình duyệt. Không cần nhập mật khẩu.</p></section><section class="settings-group"><h3>Đồng bộ dữ liệu</h3><p class="hint">Dữ liệu của WRITE được lưu ở bảng riêng, không trộn với Hỏa Lực.</p><button class="btn secondary" id="sync">↻ Đồng bộ ngay</button><p class="hint" id="syncInfo">Đăng nhập để bắt đầu đồng bộ.</p></section><section class="settings-group"><h3>Bảo vệ dữ liệu</h3><p class="hint">Hãy xuất bản sao lưu JSON định kỳ. Tránh xóa dữ liệu trình duyệt trước khi đồng bộ thành công.</p></section></div>`}
async function refreshAccount(){if(tab!=='account'||!document.querySelector('#accountStatus'))return;try{const c=await client(),{data:{user}}=await c.auth.getUser();document.querySelector('#accountStatus').textContent=user?'Đã đăng nhập: '+user.email:'Chưa đăng nhập';document.querySelector('#logout').hidden=!user;document.querySelector('#login').hidden=!!user}catch(e){document.querySelector('#accountStatus').textContent='Chưa kết nối: '+e.message}}

function nvSaveBeforeBack(){const el=document.querySelector('#body');if(current&&el){const plain=el.innerText.replace(/\u00a0/g,' ');if(plain!==current.content||safeRich(el.innerHTML)!==(current.richHtml||current.contentHtml||'')){put(current,{content:plain,richHtml:safeRich(el.innerHTML)})}}}

function random(reviewMode){const pool=active().filter(t=>t.rating!=='none'&&(reviewMode||t.status!=='done'));const due=pool.filter(isDue);const arr=due.length?due:pool;if(!arr.length){alert('Không có bài phù hợp để chọn.');return}current=arr[Math.floor(Math.random()*arr.length)];render()}

function bind(){const on=(sel,event,fn)=>{const el=$(sel);if(el)el.addEventListener(event,fn)};document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{current=db.topics.find(t=>t.id===el.dataset.open);render()});on('#add','click',()=>{const btn=$('#add'),input=$('#quick');if(!btn||btn.disabled)return;const lines=input.value.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length){input.focus();input.classList.remove('nv-quick-empty');void input.offsetWidth;input.classList.add('nv-quick-empty');return}btn.disabled=true;lines.forEach(s=>add(s,'Chưa phân loại',quickPriority));quickPriority='unclassified';input.value='';btn.classList.add('nv-quick-success');btn.textContent='✓ Đã thêm '+lines.length+' chủ đề';if(localStorage.getItem('nv-write-sound')==='on')window.nvQuickSuccessSound?.();if(navigator.vibrate&&localStorage.getItem('nv-write-fx')){try{const fx=JSON.parse(localStorage.getItem('nv-write-fx'));if(fx.vibrate)navigator.vibrate(25)}catch(e){}}const area=btn.closest('.card');if(area&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const spark=document.createElement('span');spark.className='nv-quick-spark';spark.textContent='✦';btn.appendChild(spark)}setTimeout(()=>{if(!btn.isConnected)return;btn.disabled=false;btn.classList.remove('nv-quick-success');btn.textContent='+ Thêm nhanh';},850);const recent=document.querySelector('#nvQuickRecent');if(recent){recent.textContent='✓ '+lines.length+' chủ đề vừa được tạo';recent.classList.remove('nv-quick-reveal');void recent.offsetWidth;recent.classList.add('nv-quick-reveal')} });on('#quickPriority','change',e=>{quickPriority=e.target.value});on('#random','click',()=>random(false));on('#randomReview','click',()=>random(true));on('#search','input',e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});on('#filter','change',e=>{filter=e.target.value;render()});document.querySelectorAll('[data-topic-view]').forEach(b=>b.onclick=()=>{topicView=b.dataset.topicView;localStorage.setItem('nv-write-topic-view',topicView);render()});document.querySelectorAll('[data-group-toggle]').forEach(b=>b.onclick=()=>{const id=b.dataset.groupToggle;if(collapsedTopicGroups.has(id))collapsedTopicGroups.delete(id);else collapsedTopicGroups.add(id);render()});on('#collapseTopicGroups','click',()=>{active().forEach(t=>collapsedTopicGroups.add(t.id));render()});on('#topicDensityToggle','click',()=>{topicDensity=topicDensity==='compact'?'comfortable':'compact';localStorage.setItem('nv-write-topic-density',topicDensity);render()});if($('#filter'))$('#filter').value=filter;if(current){const t=current;resizeTitle($('#title'));on('#back','click',()=>{if(nvEditorTimer){clearTimeout(nvEditorTimer);const el=$('#body');if(el){const plain=el.innerText.replace(/\u00a0/g,' ');earnXP(t,t.content||'',plain,false);put(t,{content:plain,richHtml:safeRich(el.innerHTML)})}}if(history.state?.nvWriteView&&history.length>1)history.back();else{current=null;render()}});on('#title','input',e=>{put(t,{title:e.target.value});resizeTitle(e.target)});let nvEditorTimer;on('#body','input',e=>{const inputType=e.inputType||'';const isPaste=inputType.includes('insertFromPaste')||inputType.includes('insertFromDrop')||inputType.includes('history');const el=e.currentTarget;clearTimeout(nvEditorTimer);nvEditorTimer=setTimeout(()=>{const plain=el.innerText.replace(/\u00a0/g,' ');earnXP(t,t.content||'',plain,!isPaste);put(t,{content:plain,richHtml:safeRich(el.innerHTML)});const wc=count(t.content);if($('#editorStatus'))$('#editorStatus').textContent=autoStatus(t)==='done'?'✓ Hoàn thành':autoStatus(t)==='draft'?'◐ Đang viết':'○ Chưa viết';if($('#metaStatus'))$('#metaStatus').textContent=autoStatus(t)==='done'?'✓ Hoàn thành':autoStatus(t)==='draft'?'Đang viết':'Chưa viết';if($('#wordCount'))$('#wordCount').textContent=`${wc} chữ · Đã lưu`;if($('#toolbarWordCount'))$('#toolbarWordCount').textContent=`${wc.toLocaleString('vi-VN')} chữ`},220)});
const rich=$('#body'),formatPanel=$('#formatPanel'),paperPanel=$('#backgroundPanel'),custom=$('#writeCustomization');

const showPanel=panel=>{
 if(panel===formatPanel){formatPanel.hidden=false;paperPanel.hidden=true;custom.hidden=false;rich.focus();return}
 const wasOpen=!paperPanel.hidden;
 paperPanel.hidden=wasOpen;

  const bar=document.querySelector('.write-toolbar');
  const rect=bar?.getBoundingClientRect();

 }
};

// Keep the formatting dock directly above the software keyboard.
// visualViewport measures the visible viewport when Android's keyboard opens.
// Position using the actual visual viewport, not a keyboard-height guess.
// Android Chrome may resize both window.innerHeight and visualViewport.
if(window.nvDockCleanup)window.nvDockCleanup();
let dockFrame=0;
const updateFormatDock=()=>{
 cancelAnimationFrame(dockFrame);
 dockFrame=requestAnimationFrame(()=>{
  if(!custom.isConnected)return;
  if(window.matchMedia('(min-width:900px) and (pointer:fine)').matches){custom.style.removeProperty('top');custom.style.removeProperty('bottom');return}
  const vv=window.visualViewport;
  const visualBottom=vv?vv.offsetTop+vv.height:window.innerHeight;
  // Fixed elements are laid out relative to the layout viewport. Setting
  // top explicitly prevents the dock from slipping underneath the keyboard.
  custom.style.setProperty('top',Math.max(0,visualBottom-54)+'px','important');
  custom.style.setProperty('bottom','auto','important');
 });
};
updateFormatDock();
window.visualViewport?.addEventListener('resize',updateFormatDock);
window.visualViewport?.addEventListener('scroll',updateFormatDock);
window.addEventListener('resize',updateFormatDock);
// Let Android Chrome keep the native selection visible; avoid competing scrollBy calls.
rich.addEventListener('focus',()=>{updateFormatDock();setTimeout(updateFormatDock,150);setTimeout(updateFormatDock,400)});
window.nvDockCleanup=()=>{
 window.visualViewport?.removeEventListener('resize',updateFormatDock);
 window.visualViewport?.removeEventListener('scroll',updateFormatDock);
 window.removeEventListener('resize',updateFormatDock);
 cancelAnimationFrame(dockFrame);
};
// Keep the selected text selected when tapping a formatting control.
formatPanel.addEventListener('pointerdown',e=>{
 if(e.target.closest('button'))e.preventDefault();
});

const readingBody=$('#body'),readingScreen=document.querySelector('.write-screen');
if(readingBody&&readingScreen){
 let last=readingBody.scrollTop,down=0;
 readingBody.addEventListener('scroll',()=>{
  const top=readingBody.scrollTop,delta=top-last;last=top;
  if(top<=3){readingScreen.classList.remove('reading-focus');down=0;return}
  if(delta>0)down+=delta;else if(delta<0)down=0;
  if(down>=16&&document.activeElement!==readingBody){readingScreen.classList.add('reading-focus');down=0}
 },{passive:true});
}
on('#moreSupplements','click',()=>{const extra=document.querySelector('.nv-extra-supplements');if(extra){extra.hidden=false;document.querySelector('#moreSupplements')?.remove()}});on('#relatedNew','click',()=>{const title=prompt('Tên bài viết bổ sung:');if(!title?.trim())return;const child=add(title.trim(),t.tag);links.push({id:uid(),a:t.id,b:child.id,type:'supplement',deleted:false,updated_at:new Date().toISOString()});saveLinks();current=child;render()});
on('#relatedExisting','click',()=>{const candidates=active().filter(x=>x.id!==t.id&&!related(t).some(l=>l.other.id===x.id));if(!candidates.length){alert('Chưa có bài khác để liên kết');return}const name=prompt('Nhập một phần tên bài cần liên kết:\\n'+candidates.slice(0,12).map(x=>'• '+x.title).join('\\n'));if(!name?.trim())return;const matches=candidates.filter(x=>x.title.toLocaleLowerCase().includes(name.trim().toLocaleLowerCase()));if(matches.length!==1){alert(matches.length?'Có nhiều bài trùng tên. Hãy nhập cụ thể hơn.':'Không tìm thấy bài phù hợp.');return}const kind=confirm('OK: Bài bổ sung\\nHủy: Bài liên quan')?'supplement':'related';links.push({id:uid(),a:t.id,b:matches[0].id,type:kind,deleted:false,updated_at:new Date().toISOString()});saveLinks();render()});
document.querySelectorAll('[data-related-open]').forEach(b=>b.onclick=()=>{current=db.topics.find(x=>x.id===b.dataset.relatedOpen);render();window.scrollTo(0,0)});

document.querySelectorAll('[data-priority]').forEach(b=>b.onclick=()=>{put(t,{priority:b.dataset.priority});render()});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{put(t,{rating:b.dataset.rate});render()});on('#copy','click',async()=>{try{await navigator.clipboard.writeText(`${t.title}\n\n${t.content}`);alert('Đã copy bài viết')}catch{alert('Trình duyệt chưa cho phép copy')}});on('#reviewed','click',()=>{put(t,{last_reviewed:new Date().toISOString(),review_count:(t.review_count||0)+1});render()});on('#delete','click',()=>{if(confirm('Chuyển bài vào trạng thái đã xóa?')){put(t,{deleted:true});current=null;render()}})}on('#settingsBack','click',()=>{tab=window.nvPreviousTab||'home';render();window.scrollTo(0,0)});on('#accountBack','click',()=>{tab='settings';render();window.scrollTo(0,0)});on('#openAccount','click',()=>{tab='account';render()});on('#logout','click',async()=>{try{const c=await client();const {error}=await c.auth.signOut();if(error)throw error;render()}catch(e){alert(e.message)}});

.nv-controls .nv-effects button{width:100%;text-align:left;padding:13px;font-size:14px}
.nv-settings-full{width:100%;padding:12px;border-radius:12px;border:0;background:#17212f;color:white;font-weight:700;margin-top:14px}
@media(max-width:370px){.brand{font-size:15px}#metrics .metric b{font-size:18px}#metrics .card{padding:9px 7px}}
</style>
<div class="nv-modal-backdrop" id="nvModalBackdrop" aria-hidden="true"><div class="nv-modal" role="dialog" aria-modal="true" aria-label="Tùy chỉnh nhanh"><div class="nv-modal-head">Tùy chỉnh nhanh <button type="button" class="nv-modal-close" id="nvModalClose" aria-label="Đóng">×</button></div><div class="nv-controls" id="nvControls"></div><button type="button" class="nv-settings-full" id="nvOpenSettings">Mở cài đặt đầy đủ →</button></div></div>
<script>
(()=>{const modal=document.getElementById('nvModalBackdrop'),trigger=document.getElementById('settingsBtn');
trigger.onclick=()=>{if(tab!=='settings'&&tab!=='account')window.nvPreviousTab=tab;tab='settings';current=null;render();window.scrollTo(0,0)};
const close=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');trigger.focus()};
document.getElementById('nvModalClose').onclick=close;
modal.addEventListener('click',e=>{if(e.target===modal)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close()});
document.getElementById('nvOpenSettings').onclick=()=>{close();if(tab!=='settings'&&tab!=='account')window.nvPreviousTab=tab;tab='settings';current=null;render();window.scrollTo(0,0)};
})();
</script>
</body></html>
